<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="The Night Game: Encore, Fake ID, Drop y Spotlight. Juegos de fiesta para jugar con un solo móvil.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Night Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: una pantalla de juego a altura completa; marcador arriba, carta al centro, acciones al pulgar. Estética tipo Xceed: fondo negro, tipografía blanca muy gruesa, acento rojo-coral, botones con contorno y esquinas casi rectas. Oscuro por defecto con selector claro/oscuro propio. */
:root{
  --bg:#000000;
  --surface:#131313;
  --surface-2:#1f1f1f;
  --ink:#ffffff;
  --ink-soft:#9b9b9b;
  --line:rgba(255,255,255,.16);
  --accent:#ff4a2b;
  --accent-ink:#ffffff;
  --accent-soft:rgba(255,74,43,.14);
  --good:#25c46f;
  --good-ink:#04210f;
  --bad:#ff4a2b;
  --veil:rgba(0,0,0,.7);
  --font:"Manrope", "Helvetica Neue", Arial, system-ui, sans-serif;
  --r:6px;
  color-scheme:dark;
}
:root.th-light{
  --bg:#ffffff;
  --surface:#f3f3f3;
  --surface-2:#e7e7e7;
  --ink:#000000;
  --ink-soft:#5c5c5c;
  --line:rgba(0,0,0,.14);
  --accent:#e8381b;
  --accent-ink:#ffffff;
  --accent-soft:rgba(232,56,27,.10);
  --good:#1fa85d;
  --good-ink:#ffffff;
  --bad:#e8381b;
  --veil:rgba(0,0,0,.45);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;transition:background .2s,color .2s}
#app{height:100%;max-width:520px;margin:0 auto;padding-inline:16px;padding-block:14px 18px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:800;text-wrap:balance;letter-spacing:-.02em}
p{margin:0;line-height:1.45}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:20px;min-height:0;padding-bottom:4px;overflow-anchor:none}

/* Botones */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:var(--r);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn-main{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{border:1.5px solid var(--ink)}
.btn-good{background:var(--good);color:var(--good-ink)}
.btn-bad{border:1.5px solid var(--ink)}
.btn-danger{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.3;pointer-events:none}
.row{display:flex;gap:10px}
.row>*{flex:1}
.small{font-size:13px;color:var(--ink-soft);font-weight:500}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1.5px;padding:6px 0}

/* Ajustes */
.logo{font-weight:800;font-size:clamp(42px,13vw,60px);line-height:.92;letter-spacing:-.045em}
.logo span{color:var(--accent)}
.prefs{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:var(--r);padding:3px;gap:2px;flex:none}
.seg button{min-width:40px;height:32px;border-radius:4px;font-weight:800;font-size:12px;letter-spacing:.06em;color:var(--ink-soft);display:grid;place-items:center;padding:0 8px}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.field{display:flex;flex-direction:column;gap:10px}
.field label{font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.field label .small{text-transform:none;letter-spacing:0}
.team-row{display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.team-row input{flex:1;min-width:0;height:48px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;font-weight:700}
.icon-btn{width:44px;height:44px;border-radius:var(--r);border:1.5px solid var(--line);font-size:20px;font-weight:600;flex:none;display:grid;place-items:center}
.icon-btn:active{background:var(--surface-2)}
.stepper{display:flex;align-items:center;gap:10px;align-self:flex-start}
.stepper output{min-width:56px;text-align:center;font-weight:800;font-size:24px;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:84px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 14px;font:inherit;font-weight:500;resize:vertical}
textarea::placeholder{color:var(--ink-soft)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mode{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border-radius:var(--r);background:var(--surface);border:1.5px solid transparent;min-width:0;transition:border-color .15s,background .15s}
.mode.on{border-color:var(--accent);background:var(--accent-soft)}
.mname{font-weight:800;font-size:18px;line-height:1.1;letter-spacing:-.01em;padding-right:26px}
.mtag{font-size:12.5px;color:var(--ink-soft);line-height:1.3;font-weight:500}
.lvl{margin-top:6px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:3px;border:1px solid var(--line);color:var(--ink-soft)}
.mode.on .lvl{border-color:var(--accent);color:var(--accent)}
.lvl.god{background:var(--accent);border-color:var(--accent);color:#fff}
.mode.on .lvl.god{color:#fff}
.mode.wide{grid-column:1/-1}
.check{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800}
.mode.on .check{background:var(--accent);border-color:var(--accent);color:#fff}

/* Revisión */
.review-list{display:flex;flex-direction:column}
.review-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.review-item .t{flex:1;min-width:0;font-weight:700}
.review-item .c{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-top:2px}
.review-item button{height:36px;padding:0 12px;border-radius:4px;border:1.5px solid var(--line);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;flex:none}

/* Marcador */
.top{display:flex;gap:8px;align-items:stretch}
.board{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.board::-webkit-scrollbar{display:none}
.chip{flex:1 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--r);background:var(--surface);border:1.5px solid transparent;font-size:13px;font-weight:700;white-space:nowrap}
.chip b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;margin-left:auto;padding-left:6px}
.chip.on{border-color:var(--accent)}
.menu-btn{flex:none;width:46px;min-height:44px;border-radius:var(--r);border:1.5px solid var(--line);display:grid;place-items:center}
.menu-btn svg{width:20px;height:20px;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.roundbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pips{display:flex;gap:4px}
.pip{width:24px;height:4px;border-radius:2px;background:var(--line)}
.pip.done{background:var(--ink-soft)}
.pip.now{background:var(--accent)}

/* Juego */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;min-height:0}
.timer{position:relative;width:112px;height:112px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .trk{fill:none;stroke:var(--line);stroke-width:7}
.timer .arc{fill:none;stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.timer.hot .arc{stroke:var(--accent)}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:40px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.timer.hot .num{color:var(--accent)}
.card{width:100%;max-width:400px;aspect-ratio:5/6;max-height:46vh;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;position:relative;overflow:hidden}
.card .cat{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.card .word{font-weight:800;font-size:clamp(30px,9vw,44px);line-height:1.02;letter-spacing:-.03em;text-wrap:balance;overflow-wrap:anywhere}
.card .word.long{font-size:clamp(24px,7vw,34px)}
.card .word.xlong{font-size:clamp(20px,5.8vw,27px);line-height:1.12}
.card.back{background:var(--surface);color:var(--ink);border:1.5px solid var(--accent);background-image:repeating-linear-gradient(-45deg,transparent 0 12px,var(--accent-soft) 12px 14px)}
.card.back .word{font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.card.pop{animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:.5}to{transform:none;opacity:1}}
.pause-veil{position:absolute;inset:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:22px;letter-spacing:.08em;text-transform:uppercase}
.rule{border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;width:100%}
.rule h3{font-size:28px;display:flex;align-items:center;gap:10px}
.left{font-size:12px;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* Fin de turno / ronda */
.big{font-weight:800;font-size:clamp(38px,11vw,54px);line-height:.98;letter-spacing:-.04em;text-wrap:balance}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:700}
.li .t{flex:1;min-width:0}
.li.off .t{text-decoration:line-through;opacity:.45}
.li button{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:4px;border:1.5px solid var(--line)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:12px 8px;text-align:right;border-bottom:1px solid var(--line);font-weight:600}
th:first-child,td:first-child{text-align:left;padding-left:0}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-weight:800}
td.tot{font-weight:800;font-size:20px}
tr.win td{color:var(--accent)}

/* Menú */
.veil{position:fixed;inset:0;background:var(--veil);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--bg);border-top:1.5px solid var(--line);border-radius:12px 12px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:90%;overflow-y:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{font-size:28px;margin-bottom:4px}
.sheet .btn{justify-content:flex-start}
.sheet .btn.center{justify-content:center}
.sheet .toprow{align-items:flex-start}
.slide-row{display:flex;align-items:center;gap:10px}
.slide-row input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:32px}
.slide-row output{min-width:44px;text-align:right;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
/* Animaciones de entrada */
#fx{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:hidden;display:grid;place-items:center;cursor:pointer;transition:opacity .25s}
#fx.leaving{opacity:0}
.fx-logo{font-weight:800;font-size:clamp(44px,14vw,64px);line-height:.92;letter-spacing:-.045em;color:var(--ink)}
.fx-logo b{color:var(--accent);font-weight:800}
.fx-tap{position:absolute;bottom:calc(9% + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
@keyframes fxFade{to{opacity:1}}
.lasers{position:absolute;inset:0;animation:fxOut .45s ease forwards 2.15s}
.laser{position:absolute;bottom:-10%;width:3px;height:140%;background:linear-gradient(to top,var(--accent),transparent 85%);transform-origin:bottom center;filter:drop-shadow(0 0 6px var(--accent))}
.l1{left:12%;animation:sweepL 1.3s ease-in-out 2 alternate both}
.l2{right:12%;animation:sweepR 1.3s ease-in-out 2 alternate both}
.l3{left:50%;animation:sweepC 1.3s ease-in-out 2 alternate both}
@keyframes sweepL{from{transform:rotate(-35deg)}to{transform:rotate(30deg)}}
@keyframes sweepR{from{transform:rotate(35deg)}to{transform:rotate(-30deg)}}
@keyframes sweepC{from{transform:rotate(-20deg)}to{transform:rotate(20deg)}}
@keyframes fxOut{to{opacity:0}}
.strobe{opacity:1;animation:strobe 1.6s steps(1) .4s}
@keyframes strobe{0%{opacity:1}8%{opacity:0}14%{opacity:1}20%{opacity:0}30%{opacity:1}36%{opacity:0}50%,100%{opacity:1}}
.flash{position:absolute;inset:0;background:var(--ink);opacity:0;animation:flash 1.6s steps(1) .6s}
@keyframes flash{0%{opacity:.16}8%{opacity:0}14%{opacity:.1}20%{opacity:0}30%{opacity:.07}36%{opacity:0}}
.deck{position:absolute;inset:0;display:grid;place-items:center;perspective:900px}
.fc{position:absolute;width:min(62vw,300px);aspect-ratio:5/6;border-radius:12px;background:var(--surface);border:1.5px solid var(--accent);background-image:repeating-linear-gradient(-45deg,transparent 0 10px,var(--accent-soft) 10px 12px);opacity:0;animation:fly .55s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes fly{from{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}to{opacity:1;transform:translate(0,0) rotate(var(--rr))}}
.fc.top{background:var(--accent);background-image:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;color:#fff;animation:fly .55s cubic-bezier(.2,.8,.3,1) forwards 1s,flip .6s ease forwards 1.65s}
.fc.top .msg{font-weight:800;font-size:clamp(28px,9vw,40px);line-height:1;letter-spacing:-.03em;text-wrap:balance;opacity:0;animation:fxFade .1s forwards 1.95s}
.fc.top .sub{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:0;animation:fxFade .2s forwards 2.05s}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0) scale(1.06)}}
.pnum{width:28px;height:28px;flex:none;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink-soft)}
.seg.wide{align-self:flex-start}
.seg.wide button{min-width:72px;height:38px;font-size:13px}
.games{display:flex;flex-direction:column;gap:10px}
.game{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:18px 18px 20px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);transition:border-color .15s}
.game:hover,.game:focus-visible{border-color:var(--accent)}
.gname{font-weight:800;font-size:clamp(34px,10vw,44px);line-height:1;letter-spacing:-.04em}
.game p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.45;font-weight:500;padding-right:28px}
.game .live{margin-top:4px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:3px;background:var(--accent);color:#fff}
.game .arrow{position:absolute;right:18px;bottom:18px;font-size:22px;font-weight:800;color:var(--accent)}
.idcard{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;background:var(--surface);color:var(--ink);border:1.5px solid var(--accent);background-image:repeating-linear-gradient(-45deg,transparent 0 12px,var(--accent-soft) 12px 14px)}
.idcard .id-front{display:none;flex-direction:column;align-items:center;gap:12px}
.idcard .id-back{display:flex;flex-direction:column;align-items:center;gap:10px}
.idcard .id-back .word{font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.idcard.show{background:var(--accent);background-image:none;color:#fff}
.idcard.imp.show{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.idcard.show .id-front{display:flex}
.idcard.show .id-back{display:none}
.ficlock{font-weight:800;font-size:clamp(64px,22vw,104px);letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1}
.ficlock.hot{color:var(--accent)}
.vote-list{display:flex;flex-direction:column;gap:6px}
.vote{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1.5px solid transparent;text-align:left;font-weight:700;position:relative}
.vote .t{flex:1;min-width:0}
.vote .check{position:static}
.vote.on{border-color:var(--accent);background:var(--accent-soft)}
.vote.on .check{background:var(--accent);border-color:var(--accent);color:#fff}
.reveal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rv{font-weight:800;font-size:22px;letter-spacing:-.02em;margin-top:4px;overflow-wrap:anywhere}
.links{display:flex;gap:16px;flex-wrap:wrap}
.veil.help{z-index:20}
.howto{gap:12px}
.howto .toprow{align-items:center;flex-wrap:wrap}
.howto h3{margin:6px 0 0;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.howto .lead{font-weight:700;font-size:15px}
.howto ol,.howto ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.howto li,.howto p{font-size:14.5px;line-height:1.5}
.howto li::marker{color:var(--ink-soft);font-weight:700}
.howto .btn{margin-top:8px}
.help-tabs button{min-width:84px}
/* Victoria */
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.lasers.win{animation:none;opacity:.55}
.lasers.win .l1{animation:sweepL 1.1s ease-in-out infinite alternate}
.lasers.win .l2{animation:sweepR 1.1s ease-in-out infinite alternate}
.lasers.win .l3{animation:sweepC 1.4s ease-in-out infinite alternate}
.win-wrap{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-inline:20px;max-width:100%}
.win-eyebrow{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);animation:winUp .5s ease both .15s}
.win-name{font-weight:800;font-size:clamp(46px,15vw,76px);line-height:.95;letter-spacing:-.05em;color:var(--ink);overflow-wrap:anywhere;text-wrap:balance;animation:winSlam .6s cubic-bezier(.2,1.35,.4,1) both .35s}
.win-name.long{font-size:clamp(34px,10vw,52px)}
.win-bar{width:64px;height:6px;border-radius:3px;animation:winBar .5s ease both .8s}
.win-score{font-weight:800;font-size:20px;letter-spacing:.02em;color:var(--ink-soft);font-variant-numeric:tabular-nums;animation:winUp .5s ease both .9s}
.win-score .win-num{color:var(--ink);font-size:30px}
@keyframes winSlam{from{opacity:0;transform:scale(2.4)}60%{opacity:1}to{opacity:1;transform:none}}
@keyframes winUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes winBar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* Bola de discoteca */
.ballwrap{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2;animation:ballDrop 1.2s cubic-bezier(.3,1.3,.5,1) both}
.ballwrap .cord{width:2px;height:calc(40px + env(safe-area-inset-top,0px));background:var(--line)}
.ball{width:clamp(84px,24vw,110px);aspect-ratio:1;border-radius:50%;position:relative;overflow:hidden;background:radial-gradient(circle at 35% 30%,#fff 0 6%,#cfcfcf 18%,#6b6b6b 60%,#222 100%);box-shadow:0 0 40px rgba(255,255,255,.15)}
.ball::before{content:"";position:absolute;inset:-50%;background:repeating-linear-gradient(0deg,transparent 0 9px,rgba(0,0,0,.45) 9px 10px),repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.45) 9px 10px);animation:ballTiles 2s linear infinite}
.ball::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.6),transparent 20%,transparent 50%,rgba(255,74,43,.55),transparent 70%);mix-blend-mode:screen;animation:ballSpin 1.6s linear infinite}
@keyframes ballTiles{to{transform:translateX(10px)}}
@keyframes ballSpin{to{transform:rotate(360deg)}}
@keyframes ballDrop{from{transform:translate(-50%,-220px)}to{transform:translate(-50%,0)}}
.spots{position:absolute;inset:0;z-index:0;opacity:0;animation:fxFade .5s ease forwards .9s;pointer-events:none}
.spots i{position:absolute;left:0;top:0;width:110px;height:110px;border-radius:50%;filter:blur(22px);opacity:.4;animation:roam var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes roam{0%,100%{transform:translate(var(--x0),var(--y0))}50%{transform:translate(var(--x1),var(--y1))}}
#fx .win-wrap{margin-top:clamp(60px,14vh,140px)}
#fx .lasers.win{z-index:1}
/* Podio */
.pd-scroll{gap:18px}
.pd-head{padding-top:6px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;min-height:250px;padding-top:10px}
.pd-step{flex:1;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.pd-who{font-weight:800;font-size:14px;text-align:center;line-height:1.15;overflow-wrap:anywhere;opacity:0;animation:winUp .4s ease forwards var(--d)}
.pd-who small{display:block;color:var(--ink-soft);font-weight:700;font-size:12px;margin-top:2px}
.pd-step.first .pd-who{font-size:17px}
.pd-block{width:100%;height:0;border-radius:6px 6px 0 0;background:var(--surface-2);border-top:3px solid var(--line);display:flex;justify-content:center;padding-top:10px;font-weight:800;font-size:28px;color:var(--ink-soft);overflow:hidden;animation:pdGrow .7s cubic-bezier(.2,.8,.3,1) forwards var(--d)}
.pd-step.first .pd-block{background:var(--accent);border-top-color:var(--team,#ffd23f);color:#fff;font-size:38px}
@keyframes pdGrow{to{height:var(--h)}}
.pd-crown{width:40px;height:28px;fill:#ffd23f;opacity:0;animation:pdCrown .5s cubic-bezier(.3,1.5,.5,1) forwards 1.5s}
@keyframes pdCrown{from{opacity:0;transform:translateY(-50px) rotate(-20deg)}to{opacity:1;transform:none}}
.pd-rest{display:flex;flex-direction:column}
.pd-rest div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700}
.pd-detail{display:flex;flex-direction:column;gap:6px}
/* Guestlist (revelación Fake ID) */
.gl-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;padding-inline:20px;text-align:center}
.gl-list{width:min(86%,340px);background:#f3efe6;color:#151515;border-radius:6px;padding:18px 18px 24px;transform:rotate(-2deg);box-shadow:0 10px 30px rgba(0,0,0,.45);font-family:ui-monospace,Menlo,Consolas,monospace;text-align:left;position:relative;margin-bottom:18px;animation:glIn .5s cubic-bezier(.2,.8,.3,1) both}
@keyframes glIn{from{opacity:0;transform:translateY(40px) rotate(-6deg)}to{opacity:1;transform:rotate(-2deg)}}
.gl-list h4{margin:0 0 10px;font-family:var(--font);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#8a1f10}
.gl-list ul{margin:0;padding:0}
.gl-list.two ul{columns:2;column-gap:14px}
.gl-list li{list-style:none;font-size:15px;font-weight:700;padding:5px 0;border-bottom:1px dashed rgba(0,0,0,.15);position:relative;break-inside:avoid;overflow-wrap:anywhere}
.gl-list.two li{font-size:13px}
.gl-list .strike{position:absolute;left:-4px;top:50%;height:3px;width:0;background:#e8381b;border-radius:2px;animation:glStrike .5s ease forwards 1s}
.gl-list .strike.grey{background:#888}
@keyframes glStrike{to{width:calc(100% + 8px)}}
.gl-list li.sneak{animation:glSneak 1.1s ease-in-out 2.2s infinite}
@keyframes glSneak{0%,100%{background:transparent}50%{background:rgba(232,56,27,.28)}}
.gl-stamp{position:absolute;right:-6%;bottom:-10%;border:4px solid #e8381b;color:#e8381b;background:rgba(243,239,230,.7);font-family:var(--font);font-weight:800;font-size:28px;padding:2px 12px;border-radius:6px;transform:rotate(-14deg) scale(3);opacity:0;animation:glStamp .35s cubic-bezier(.3,1.6,.5,1) forwards 1.7s}
@keyframes glStamp{to{opacity:1;transform:rotate(-14deg) scale(1)}}
.gl-verdict{font-weight:800;font-size:clamp(32px,10vw,46px);line-height:.95;letter-spacing:-.04em;color:var(--ink);opacity:0;animation:winSlam .55s cubic-bezier(.2,1.35,.4,1) forwards 2.1s}
.gl-verdict.bad{color:var(--accent)}
.gl-sub{font-weight:700;color:var(--ink-soft);opacity:0;animation:winUp .4s ease forwards 2.5s}
.gl-tap{animation:fxFade .5s ease forwards 2.8s;opacity:0}
/* Foco (entrada Fake ID) */
.foco-in{position:absolute;inset:0;background:#000;color:#fff}
.foco-words{transition:opacity .2s}
.foco-words span{position:absolute;font-weight:800;font-size:clamp(18px,6vw,28px);color:rgba(255,255,255,.4);letter-spacing:-.02em;white-space:nowrap}
.foco-logo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding-inline:20px}
.fl-name{font-weight:800;font-size:clamp(56px,18vw,88px);line-height:.9;letter-spacing:-.05em;color:#fff}
.fl-name b{color:#ff4a2b}
.fl-tag{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9b9b9b}
.foco-dark{position:absolute;inset:0;background:#000;pointer-events:none}
.foco-in .fx-tap{color:#9b9b9b;z-index:2}
.win-score.note{font-size:14px;font-weight:700;letter-spacing:.02em;max-width:280px}
.tally{display:flex;flex-direction:column;gap:8px}
.tally-row{display:flex;align-items:center;gap:14px}
.tally-row>div:not(.vs){flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px;border-radius:var(--r);background:var(--surface);border:1.5px solid transparent}
.tally-row b{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.tally-row span{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.tally-row .lead{border-color:var(--accent)}
.tally-row .vs{font-weight:800;color:var(--ink-soft)}
.seg.wide button{min-width:0;padding:0 12px}
/* Drop */
.hearts{color:var(--accent);letter-spacing:2px;font-size:15px;white-space:nowrap}
.hearts i{font-style:normal;color:var(--line)}
.dr-lives{display:flex;flex-direction:column}
.dr-lives>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700}
.dr-lives>div span{min-width:0;overflow-wrap:anywhere}
.dr-lives>div.out{opacity:.4;text-decoration:line-through}
.dr-lives>div.hit{color:var(--accent)}
.dr-hold{text-align:center;display:flex;flex-direction:column;gap:6px}
.dr-holder{font-weight:800;font-size:clamp(36px,11vw,52px);letter-spacing:-.04em;line-height:1}
.dr-holder.swap{animation:drSwap .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes drSwap{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.dr-card.beat{animation:drBeat var(--bpm,600ms) ease-out}
@keyframes drBeat{0%{transform:scale(1.045);box-shadow:0 0 0 0 rgba(255,74,43,.55)}100%{transform:scale(1);box-shadow:0 0 0 28px rgba(255,74,43,0)}}
.dr-pass{min-height:76px;font-size:18px}
.dr-ex{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:var(--r);background:var(--surface)}
.dr-ex p{font-weight:700;font-size:16px}
#fx.shake{animation:fxShake .5s ease}
@keyframes fxShake{15%{transform:translate(-10px,6px)}30%{transform:translate(9px,-7px)}45%{transform:translate(-7px,4px)}60%{transform:translate(5px,-3px)}75%{transform:translate(-3px,2px)}}
.boom{position:absolute;inset:0;display:grid;place-items:center;background:var(--accent);animation:boomBg 1.2s ease forwards}
@keyframes boomBg{0%{background:#fff}12%{background:var(--accent)}100%{background:#000}}
.boom .ring{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:6px solid #fff;opacity:0;animation:boomRing 1s ease-out forwards}
.boom .r2{animation-delay:.12s;border-color:var(--accent)}.boom .r3{animation-delay:.24s}
@keyframes boomRing{from{opacity:1;transform:scale(.2)}to{opacity:0;transform:scale(14)}}
.boom-word{position:relative;font-weight:800;font-size:clamp(84px,30vw,150px);letter-spacing:-.06em;color:#fff;animation:winSlam .5s cubic-bezier(.2,1.35,.4,1) both}
.boom-sub{position:absolute;left:0;right:0;top:calc(50% + clamp(56px,17vw,90px));text-align:center;font-weight:800;font-size:22px;color:#fff;opacity:0;animation:winUp .4s ease forwards .4s}
/* Spotlight */
.sp-q{display:flex;flex-direction:column;gap:12px;padding:22px 20px;border-radius:10px;background:var(--surface);border:1.5px solid var(--line)}
.sp-text{font-weight:800;font-size:clamp(28px,8.5vw,40px);line-height:1.05;letter-spacing:-.03em;text-wrap:balance}
.sp-mini .eyebrow{padding-bottom:4px}
.cd{position:absolute;inset:0;display:grid;place-items:center}
.cd-num{font-weight:800;font-size:clamp(120px,40vw,200px);letter-spacing:-.06em;color:var(--ink);animation:cdPop .8s ease both}
.cd-num.go{color:var(--accent);font-size:clamp(56px,18vw,96px)}
@keyframes cdPop{0%{transform:scale(1.8);opacity:0}25%{transform:scale(1);opacity:1}100%{opacity:1}}
.sp-rev .sp-grid{position:absolute;inset:12% 8% 32%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:center}
.sp-rev .sp-grid.many{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sp-rev .sp-grid div{display:grid;place-items:center;min-height:48px;padding:8px;border-radius:8px;background:#161616;color:#777;font-weight:800;font-size:16px;text-align:center;overflow-wrap:anywhere;transition:background .3s,color .3s}
.sp-rev .sp-grid.many div{font-size:13px;min-height:40px}
.sp-rev .sp-grid div.hit{background:#ff4a2b;color:#fff;box-shadow:0 0 40px rgba(255,74,43,.6)}
.sp-verdict{position:absolute;left:0;right:0;bottom:16%;text-align:center;display:flex;flex-direction:column;gap:8px;padding-inline:20px;opacity:0;transition:opacity .4s}
.sp-rev.done .sp-verdict{opacity:1}
.sp-names{font-weight:800;font-size:clamp(32px,10vw,48px);letter-spacing:-.04em;color:#fff;line-height:1}
.sp-verdict .eyebrow{color:#ff4a2b}
.games .game:nth-child(n+3) .gname{font-size:clamp(30px,9vw,40px)}
/* Entrada Drop */
.dri,.woof,.spi,.star-w{position:absolute;inset:0;background:#000;color:#fff;overflow:hidden}
.dri-eq{position:absolute;left:6%;right:6%;bottom:30%;height:34%;display:flex;align-items:flex-end;gap:2.5%;transform-origin:bottom;transform:scaleY(.08);transition:opacity .15s}
.dri-eq i{flex:1;height:var(--h);background:#fff;border-radius:2px;animation:eqB .32s ease-in-out infinite alternate var(--d)}
.dri-eq i:nth-child(4n){background:#ff4a2b}
@keyframes eqB{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.dri.rise .dri-eq{transition:transform 1.5s cubic-bezier(.6,0,.9,.6);transform:scaleY(1)}
.dri-meter{position:absolute;left:12%;right:12%;bottom:22%;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.dri-meter i{position:absolute;inset:0;background:#ff4a2b;transform-origin:left;transform:scaleX(0)}
.dri.rise .dri-meter i{transition:transform 1.5s cubic-bezier(.6,0,.9,.6);transform:scaleX(1)}
.dri-label{position:absolute;left:0;right:0;bottom:17%;text-align:center;font-size:11px;font-weight:800;letter-spacing:.3em;color:#9b9b9b}
.dri.silence .dri-eq,.dri.silence .dri-meter,.dri.silence .dri-label{opacity:0}
.dri-logo{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:clamp(84px,28vw,140px);letter-spacing:-.06em;opacity:0;transform:scale(2.6)}
.dri-logo span{color:#ff4a2b}
.dri.dropped .dri-logo{opacity:1;transform:none;transition:transform .45s cubic-bezier(.2,1.35,.4,1),opacity .1s}
.dri.dropped .dri-eq{opacity:1;bottom:0;height:100%;transform:scaleY(1);opacity:.18;transition:none}
.dri.calm .dri-eq{opacity:.12}
.dri-tag{position:absolute;left:0;right:0;top:calc(50% + clamp(50px,15vw,80px));text-align:center;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9b9b9b;opacity:0}
.dri.dropped .dri-tag{opacity:1;transition:opacity .4s .3s}
.dri .fx-tap{opacity:0}.dri.dropped .fx-tap{opacity:1;transition:opacity .4s .6s}
/* Explosión Drop */
.woof{display:grid;place-items:center}
.woof-flash{position:absolute;inset:0;background:#fff;opacity:0}
.woof.blown .woof-flash{animation:wFlash .9s steps(1)}
@keyframes wFlash{0%{opacity:1}10%{opacity:0}20%{opacity:.6;background:#ff4a2b}32%{opacity:0}44%{opacity:.35}56%{opacity:0}}
.spk{position:absolute;width:min(62vw,280px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center}
.spk i{position:absolute;border-radius:50%}
.spk .s1{inset:0;background:radial-gradient(circle,#2a2a2a 0 60%,#111 61% 100%);box-shadow:0 0 0 6px #1a1a1a,inset 0 0 30px #000}
.spk .s2{inset:16%;background:radial-gradient(circle,#3a3a3a,#141414 70%);border:3px solid #050505}
.spk .s3{inset:34%;background:repeating-radial-gradient(circle,#222 0 4px,#2c2c2c 4px 8px)}
.spk .s4{inset:42%;background:radial-gradient(circle at 40% 35%,#666,#111)}
.woof.thump .spk{animation:thump .17s ease-out}
@keyframes thump{0%{transform:scale(1)}40%{transform:scale(1.13)}100%{transform:scale(1)}}
.woof.blown .spk{animation:blow .5s ease-in forwards}
@keyframes blow{to{transform:scale(5);opacity:0}}
.woof-wave{position:absolute;left:0;right:0;top:50%;height:70%;transform:translateY(-50%) scaleY(0);display:flex;align-items:center;gap:1.2%;padding-inline:2%}
.woof-wave i{flex:1;height:var(--h);background:#ff4a2b;border-radius:3px}
.woof-wave i:nth-child(3n){background:#fff}
.woof.blown .woof-wave{animation:wave 1.4s cubic-bezier(.2,.9,.3,1) forwards .05s}
@keyframes wave{0%{transform:translateY(-50%) scaleY(0)}18%{transform:translateY(-50%) scaleY(1.15)}100%{transform:translateY(-50%) scaleY(.12);opacity:.35}}
.woof-word{position:relative;font-weight:800;font-size:clamp(84px,30vw,150px);letter-spacing:-.06em;opacity:0;line-height:1}
.woof-word::before,.woof-word::after{content:attr(data-t);position:absolute;inset:0;mix-blend-mode:screen}
.woof-word::before{color:#ff004c;transform:translate(-6px,2px)}
.woof-word::after{color:#00e5ff;transform:translate(6px,-2px)}
.woof.blown .woof-word{animation:wWord .55s cubic-bezier(.2,1.35,.4,1) forwards .1s}
.woof.blown .woof-word::before,.woof.blown .woof-word::after{animation:wSplit .6s ease-out forwards .15s}
@keyframes wWord{from{opacity:0;transform:scale(2.6)}to{opacity:1;transform:none}}
@keyframes wSplit{to{transform:none;opacity:0}}
.woof-sub{position:absolute;z-index:3;left:0;right:0;top:calc(50% + clamp(52px,17vw,88px));text-align:center;font-weight:800;font-size:24px;opacity:0;text-shadow:0 2px 12px #000,0 0 4px #000}
.woof-word{z-index:3}
.woof.blown .woof-sub{animation:winUp .4s ease forwards .5s}
/* Entrada Spotlight */
.beam{position:absolute;top:-6%;width:46%;height:120%;transform-origin:50% 0;background:linear-gradient(to bottom,rgba(255,255,255,.55),rgba(255,255,255,.06) 75%,transparent);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);mix-blend-mode:screen;filter:blur(1px)}
.b1{left:-8%;animation:bm1 2.1s ease-in-out forwards}
.b2{left:27%;animation:bm2 2.1s ease-in-out forwards;background:linear-gradient(to bottom,rgba(255,74,43,.6),rgba(255,74,43,.08) 75%,transparent)}
.b3{right:-8%;animation:bm3 2.1s ease-in-out forwards}
@keyframes bm1{0%{transform:rotate(-38deg)}35%{transform:rotate(20deg)}70%{transform:rotate(-15deg)}100%{transform:rotate(-24deg)}}
@keyframes bm2{0%{transform:rotate(30deg)}35%{transform:rotate(-28deg)}70%{transform:rotate(18deg)}100%{transform:rotate(0)}}
@keyframes bm3{0%{transform:rotate(38deg)}35%{transform:rotate(-20deg)}70%{transform:rotate(15deg)}100%{transform:rotate(24deg)}}
.spi-floor{position:absolute;left:10%;right:10%;top:56%;height:12%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.35),transparent 70%);opacity:0;transition:opacity .5s}
.spi-logo{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:clamp(60px,19vw,96px);letter-spacing:-.05em;color:#222;transition:color .3s,text-shadow .5s}
.spi-logo b{font-weight:800;color:#2a1410;transition:color .3s}
.spi.lit .spi-logo{color:#fff;text-shadow:0 0 40px rgba(255,255,255,.45)}
.spi.lit .spi-logo b{color:#ff4a2b}
.spi.lit .spi-floor{opacity:1}
.spi-tag{position:absolute;left:0;right:0;top:calc(50% + clamp(44px,13vw,64px));text-align:center;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#9b9b9b;opacity:0;transition:opacity .5s .2s}
.spi.lit .spi-tag{opacity:1}
.spi .fx-tap{opacity:0;transition:opacity .5s .5s}.spi.lit .fx-tap{opacity:1}
/* Estrella Spotlight */
.star-w{display:grid;place-items:center}
.sw-rays{position:absolute;left:50%;top:48%;width:180vmax;height:180vmax;margin:-90vmax 0 0 -90vmax;background:repeating-conic-gradient(rgba(255,210,63,.16) 0 7deg,transparent 7deg 20deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 45%);mask:radial-gradient(circle,#000 0,transparent 45%);opacity:0;animation:rayIn .8s ease forwards .7s,raySpin 24s linear infinite}
@keyframes rayIn{to{opacity:1}}
@keyframes raySpin{to{transform:rotate(360deg)}}
.sw-beam{position:absolute;left:50%;top:-5%;width:90%;height:75%;transform:translateX(-50%) scaleY(0);transform-origin:top;background:linear-gradient(to bottom,rgba(255,255,255,.5),rgba(255,255,255,.05));clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);animation:swBeam .5s ease-out forwards .2s}
@keyframes swBeam{to{transform:translateX(-50%) scaleY(1)}}
.sw-glitter{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sw-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-inline:20px;margin-top:12vh}
.sw-star{width:46px;height:46px;fill:#ffd23f;filter:drop-shadow(0 0 12px rgba(255,210,63,.8));opacity:0;animation:swStar .6s cubic-bezier(.3,1.6,.5,1) forwards .55s}
@keyframes swStar{from{opacity:0;transform:scale(0) rotate(-120deg)}to{opacity:1;transform:none}}
.sw-eyebrow{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#ffd23f;opacity:0;animation:winUp .5s ease forwards .7s}
.sw-name{font-weight:800;font-size:clamp(46px,15vw,76px);line-height:.95;letter-spacing:-.05em;overflow-wrap:anywhere;text-shadow:0 0 30px rgba(255,210,63,.45);opacity:0;animation:winSlam .6s cubic-bezier(.2,1.35,.4,1) forwards .8s}
.sw-name.long{font-size:clamp(34px,10vw,52px)}
.sw-sub{font-weight:800;color:#9b9b9b;font-size:18px;opacity:0;animation:winUp .5s ease forwards 1.1s}
.sw-sub b{color:#fff;font-size:28px}
.star-w .fx-tap{color:#9b9b9b}

let AC=null;

/* ---------- Temporizador ---------- */
let raf=null,endsAt=0,lastWhole=null;
function startTimer(){endsAt=performance.now()+S.timeLeft*1000;S.paused=false;lastWhole=null;loop();keepAwake()}
function stopTimer(){cancelAnimationFrame(raf);raf=null}
function loop(){
  const left=Math.max(0,(endsAt-performance.now())/1000);S.timeLeft=left;
  paintTimer();
  const whole=Math.ceil(left);
  if(whole!==lastWhole){if(whole<=5&&whole>0)beep(660,.08,.15);lastWhole=whole}
  if(left<=0){stopTimer();timeUp();return}
  raf=requestAnimationFrame(loop);
}
function paintTimer(){
  const el=document.getElementById("timer");if(!el)return;
  const C=2*Math.PI*52,frac=S.timeLeft/S.turnSecs;
  el.querySelector(".arc").style.strokeDashoffset=C*(1-frac);
  el.querySelector(".num").textContent=Math.ceil(S.timeLeft);
  el.classList.toggle("hot",S.timeLeft<=5);
}

function customCards(){return (S.custom||"").split(/\n|,/).map(s=>s.trim()).filter(Boolean)}

  const custom=[...new Set(customCards())].map(t=>[t,"custom",t]);
  const pools=shuffle(S.modes).map(m=>shuffle(THEMES[m].pool));const pool=[];
  for(let i=0;pools.some(p=>i<p.length);i++)pools.forEach(p=>{if(i<p.length)pool.push(p[i])});
  const need=S.numCards;
  S.deck=[...custom,...pool.slice(0,need)];
  S.spare=pool.slice(need);
}
function startGame(){S.scores=S.teams.map(()=>[0,0,0]);S.round=1;S.teamIdx=0;S.remaining=shuffle(S.deck);S.screen="roundIntro"}

  if(!S.current)return;

  if(S.remaining.length===0){S.current=null;stopTimer();endTurn(true);return}
  drawCard();render();
}
function pass(){if(!ROUNDS[S.round].pass||!S.current||S.remaining.length===0)return;S.remaining.push(S.current);drawCard();render()}
function timeUp(){beep(330,.5,.25);if(S.current){S.remaining.push(S.current);S.current=null}S.remaining=shuffle(S.remaining);endTurn(false)}

}

      ${S.teams.length<6?`<button class="btn btn-ghost" data-a="addTeam" style="min-height:46px">${t.addTeam}</button>`:""}
    </div>
    <div class="field"><div class="toprow"><label for="numCards">${t.cards}</label><span class="small">${customCards().length?t.plusCustom(customCards().length)+" · ":""}${t.maxCards(avail())}</span></div>
      <div class="slide-row"><button class="icon-btn" data-a="cards" data-d="-1" aria-label="${t.fewer}">−</button><input type="range" id="numCards" min="10" max="${avail()}" step="1" value="${S.numCards}"><button class="icon-btn" data-a="cards" data-d="1" aria-label="${t.more}">+</button><output id="numOut">${S.numCards}</output></div>
    </div>
    <div class="row" style="flex-wrap:wrap">
      <div class="field"><label>${t.secs}</label><div class="stepper"><button class="icon-btn" data-a="secs" data-d="-5" aria-label="${t.fewer}">−</button><output>${S.turnSecs}</output><button class="icon-btn" data-a="secs" data-d="5" aria-label="${t.more}">+</button></div></div>
    </div>
    <div class="field"><label for="custom">${t.custom} <span class="small">${t.customHint}</span></label>
      <textarea id="custom" placeholder="${esc(t.customPh)}">${esc(S.custom)}</textarea></div>

},
review(){const t=T();
  return `<div class="toprow"><button class="link" data-a="back">${t.settings}</button><span class="small">${S.modes.length>1?t.nThemes(S.modes.length):themeName(S.modes[0])} · ${t.cardsN(S.deck.length)}</span></div>
  <div><h2 style="font-size:28px">${t.reviewH}</h2><p class="small" style="margin-top:6px">${t.reviewP}</p></div>
  <div class="scroll"><div class="review-list">${S.deck.map((c,i)=>`<div class="review-item"><div class="t">${esc(cardWord(c))}<div class="c">${esc(cardCat(c))}</div></div><button data-a="swap" data-i="${i}" ${canSwap(c)?"":"disabled"}>${t.swap}</button></div>`).join("")}</div></div>
  <button class="btn btn-main" data-a="start">${t.shuffleStart}</button>`;
},
roundIntro(){const t=T(),r=ROUNDS[S.round];
  return `${board()}<div class="stage" style="align-items:stretch">
    <div class="eyebrow">${t.roundOf(S.round)}</div>
    <div class="big">${rName(S.round)}</div>
    <p style="font-size:19px">${rRule(S.round)}</p>
    <p class="small">${r.pass?t.canPass:t.noPass} ${S.round>1?t.sameCards(S.deck.length):""}</p>
  </div>
  <button class="btn btn-main" data-a="toReady">${t.go}</button>`;
},
turnReady(){const t=T(),tm=S.teams[S.teamIdx];
  return `${board()}${roundbar()}
  <div class="stage">
    <div class="rule"><div class="eyebrow">${t.turnOf}</div><h3><span class="dot" style="background:${tm.color};width:18px;height:18px"></span>${esc(tm.name)}</h3><p class="small">${rRule(S.round)}</p></div>
    <button class="card back" data-a="reveal" aria-label="${t.revealAria}"><div class="word">${t.tapReveal}</div><div class="cat" style="opacity:.8">${t.clockStarts(S.turnSecs)}</div></button>
    <div class="left">${t.leftRound(S.remaining.length)}</div>
  </div>`;
},
playing(){const t=T(),c=S.current,r=ROUNDS[S.round],w=c?cardWord(c):"";
  return `${board()}${roundbar()}
  <div class="stage">
    ${timerHTML()}
    <div class="card pop" aria-live="polite"><div class="cat">${c?esc(cardCat(c)):""}</div><div class="word ${w.length>34?"xlong":w.length>18?"long":""}">${esc(w)}</div>${S.paused?`<div class="pause-veil">${t.paused}</div>`:""}</div>
    <div class="left">${t.moreDeck(S.remaining.length,S.turnGuessed.length)}</div>
  </div>
  <div class="row">
    <button class="btn btn-bad" data-a="pass" ${(!r.pass||S.remaining.length===0||S.paused)?"disabled":""}>${t.pass}</button>
    <button class="btn btn-good" data-a="hit" style="flex:1.6" ${S.paused?"disabled":""}>${t.hit}</button>
  </div>
  ${!r.pass?`<p class="small" style="text-align:center">${t.noSkipR1}</p>`:S.remaining.length===0?`<p class="small" style="text-align:center">${t.lastCard}</p>`:""}
  <button class="link" data-a="pause" style="align-self:center">${S.paused?t.resume:t.pause}</button>`;
},
turnEnd(){const t=T(),tm=S.teams[S.teamIdx],n=S.turnGuessed.filter(g=>g.ok).length,nxt=S.teams[(S.teamIdx+1)%S.teams.length];
  return `${board()}${roundbar()}
  <div><div class="eyebrow">${S.deckEmpty?t.deckDone:t.timeUp}</div><div class="big">${t.plusFor(n,esc(tm.name))}</div></div>
  <div class="scroll">${S.turnGuessed.length?`<p class="small">${t.voidQ}</p><div class="list">${S.turnGuessed.map((g,i)=>`<div class="li ${g.ok?"":"off"}"><span class="t">${esc(cardWord(g.card))}</span><button data-a="toggle" data-i="${i}">${g.ok?t.void:t.restore}</button></div>`).join("")}</div>`:`<p class="small">${t.none}</p>`}</div>
  <button class="btn btn-main" data-a="next">${S.deckEmpty?(S.round===3?t.seeFinal:t.closeRound(S.round)):t.passPhone(esc(nxt.name))}</button>`;
},
roundEnd(){const t=T();
  return `<div class="toprow"><div class="eyebrow">${t.endOfRound(S.round)}</div>${menuBtn()}</div><div><div class="big">${rName(S.round)}</div></div>
  <div class="scroll">${table()}<p class="small">${t.next}: <b>${rName(S.round+1)}</b>. ${rRule(S.round+1)} ${t.starts(esc(S.teams[S.teamIdx].name))}</p></div>
  <button class="btn btn-main" data-a="nextRound">${t.startRound(S.round+1)}</button>`;
},
gameEnd(){const tot=totals();
  return `<div class="scroll pd-scroll">${podiumHTML(S.teams.map((x,i)=>({name:x.name,score:tot[i],color:x.color})))}
    <div class="pd-detail"><div class="eyebrow">${P().detail}</div>${table()}</div></div>
  ${finalButtons("again","newSetup")}`;
}
};
function table(){
  const tot=totals(),max=Math.max(...tot),order=S.teams.map((x,i)=>i).sort((a,b)=>tot[b]-tot[a]);
  return `<div style="overflow-x:auto"><table><thead><tr><th>${T().team}</th><th>R1</th><th>R2</th><th>R3</th><th>Total</th></tr></thead><tbody>${order.map(i=>`<tr class="${tot[i]===max&&max>0?"win":""}"><td><span class="dot" style="background:${S.teams[i].color};display:inline-block;margin-right:8px;vertical-align:middle"></span>${esc(S.teams[i].name)}</td>${S.scores[i].map((v,r)=>`<td>${r<S.round?v:"–"}</td>`).join("")}<td class="tot">${tot[i]}</td></tr>`).join("")}</tbody></table></div>`;
}

  <li>Sale un tema, por ejemplo «Club de Berlín» o «Película de terror». Quien tiene el móvil pulsa <b>¡Empieza!</b></li>
  <li>Di algo que encaje y pulsa <b>Pasar</b>. El siguiente hace lo mismo. El ritmo se acelera como un build-up.</li>
  <li>Si repites, te quedas en blanco o lo que dices no vale, el grupo no te deja pasar.</li>
  <li>Cuando llega el <b>drop</b>, quien tenga el móvil pierde una vida. Después salen ejemplos que valían.</li></ol>
  <h3>Quién gana</h3><p>El último jugador que conserve vidas. Al final, el podio muestra el orden en que cayó cada uno.</p>`,
 spot:`<p class="lead">De 3 a 20 jugadores · «¿Quién es más probable que…?».</p>
  <h3>Preparación</h3><ul>
  <li>Añadid a los jugadores.</li>
  <li><b>Mazos:</b> Clásico (vida diaria y manías) y Noche (fiesta, clubs y festivales). Podéis usar los dos.</li>
  <li>Elegid cuántas rondas jugar (de 5 a 50).</li></ul>
  <h3>Una ronda</h3><ol>
  <li>Leed la frase en voz alta y pulsad <b>3, 2, 1… ¡Señalad!</b> Al terminar la cuenta, todos señalan a la vez.</li>
  <li>Marcad en el móvil a quien más dedos ha recibido. Si hay empate, marcad a todos los empatados.</li>
  <li>El foco lo busca entre todos los nombres y se lleva un punto.</li></ol>
  <h3>Quién gana</h3><p>Quien acumule más focos al acabar las rondas: la estrella de la noche.</p>`,
 fakeid:`<p class="lead">De 3 a 20 jugadores · todos tienen la misma carta menos el impostor.</p>
  <h3>Preparación</h3><ul>
  <li>Añadid a todos los jugadores y elegid cuántos impostores (como máximo, algo menos de la mitad).</li>
  <li><b>Tiempo de debate:</b> de 1 a 10 minutos.</li>
  <li><b>Pista para el impostor:</b> sin pista, solo la categoría («Cine») o detallada («Cine · Director/a de cine»).</li>
  <li>Solo se usan cartas cortas, de una a tres palabras, y también las que añadisteis en Encore.</li></ul>
  <h3>Una ronda</h3><ol>
  <li><b>Reparto:</b> el móvil pasa de mano en mano. Mantén pulsado para ver tu carta, suelta para ocultarla y pásalo.</li>
  <li><b>Pistas:</b> empieza quien diga la app y, por turnos, cada uno dice <b>una palabra</b> relacionada. Lo bastante clara para demostrar que la sabes, sin regalársela al impostor.</li>
  <li><b>Debate:</b> arrancad la cuenta atrás y discutid quién miente.</li>
  <li><b>Votación:</b> poneos de acuerdo y expulsad a una persona.<br>· Si era impostor, tiene una última oportunidad: si adivina la carta, roba la ronda.<br>· Si era inocente, ganan los impostores.</li>
  <li><b>Revelación:</b> la app enseña la carta, quién era impostor y los puntos.</li></ol>
  <h3>Quién gana</h3><ul>
  <li><b>Los inocentes</b>, si pillan al impostor y este no adivina la carta.</li>
  <li><b>El impostor</b>, si se libra de la votación o adivina la carta.</li></ul>
  <p>Con «Jugar de nuevo» empieza otra ronda con carta e impostor nuevos, sin repetir cartas. El marcador de la noche lleva la cuenta de cuántas rondas gana cada bando.</p>`
},
en:{
 title:"How to play",close:"Got it",
 general:`<h3>Across the app</h3><ul>
  <li><b>ES / EN</b> switches the whole app, cards included. Names of people, clubs and brands stay as they are.</li>
  <li><b>Moon / sun</b> switches between dark and light mode.</li>
  <li>The <b>☰</b> menu pauses the clock and lets you check scores, switch game, go back to settings or end the game.</li>
  <li>Each game saves its progress on this phone. If you leave the app mid-turn, the clock pauses.</li></ul>`,
 encore:`<p class="lead">Teams · 3 rounds · the same deck every round.</p>
  <h3>Setup</h3><ol>
  <li>Name your teams (2 to 6).</li>
  <li>Pick one or more categories and how many cards to play. They're split evenly between categories.</li>
  <li>Set the time per turn (60 s by default).</li>
  <li>Optionally add your own cards, one per line. They go on top of the number you chose.</li>
  <li>Check the deck and swap any card nobody knows: you'll get another from the same category.</li></ol>
  <h3>A turn</h3><ol>
  <li>Tap the card to reveal it. The clock starts right then.</li>
  <li><b>✓ Got it</b> scores a point and shows the next card. <b>Skip</b> sends it to the bottom of the deck (not allowed in round 1).</li>
  <li>When time's up, cancel any that didn't count and pass the phone to the next team.</li></ol>
  <h3>The three rounds</h3><ol>
  <li><b>Free description:</b> say anything except the word or its root.</li>
  <li><b>One word only:</b> one clue, and your team gets one guess.</li>
  <li><b>Charades:</b> no talking. Only gestures and sounds.</li></ol>
  <p>Each round lasts until the deck is empty; then the same deck is reshuffled for the next one. After round 3, the team with the most points wins.</p>`,
 drop:`<p class="lead">3 to 20 players · the bomb goes from hand to hand.</p>
  <h3>Setup</h3><ul>
  <li>Add the players and choose how many <b>lives</b> each one has (1 to 5).</li>
  <li><b>Fuse:</b> short, normal or long. Nobody knows when it goes off.</li>
  <li>Pick the categories the topics come from.</li></ul>
  <h3>A round</h3><ol>
  <li>A topic comes up, such as “Berlin club” or “Horror film”. Whoever has the phone taps <b>Start!</b></li>
  <li>Say something that fits and tap <b>Pass</b>. The next player does the same. The beat speeds up like a build-up.</li>
  <li>If you repeat, go blank or your answer doesn't count, the group won't let you pass.</li>
  <li>When the <b>drop</b> hits, whoever is holding the phone loses a life. Then you see some valid answers.</li></ol>
  <h3>Who wins</h3><p>The last player with lives left. The podium shows the order everyone went out in.</p>`,
 spot:`<p class="lead">3 to 20 players · “Who's most likely to…?”</p>
  <h3>Setup</h3><ul>
  <li>Add the players.</li>
  <li><b>Decks:</b> Classic (everyday life and quirks) and Night out (parties, clubs and festivals). You can use both.</li>
  <li>Choose how many rounds to play (5 to 50).</li></ul>
  <h3>A round</h3><ol>
  <li>Read the line out loud and tap <b>3, 2, 1… Point!</b> When the countdown ends, everyone points at the same time.</li>
  <li>Tick the player who got the most fingers. If it's a tie, tick everyone who tied.</li>
  <li>The spotlight hunts through the names, finds them and they score a point.</li></ol>
  <h3>Who wins</h3><p>Whoever has the most spotlights when the rounds are over: the star of the night.</p>`,
 fakeid:`<p class="lead">3 to 20 players · everyone has the same card except the impostor.</p>
  <h3>Setup</h3><ul>
  <li>Add every player and choose how many impostors (at most just under half the group).</li>
  <li><b>Discussion time:</b> 1 to 10 minutes.</li>
  <li><b>Hint for the impostor:</b> no hint, just the category (“Movies”) or detailed (“Movies · Film director”).</li>
  <li>Only short cards of one to three words are used, plus any you added in Encore.</li></ul>
  <h3>A round</h3><ol>
  <li><b>Deal:</b> pass the phone around. Press and hold to see your card, let go to hide it, then pass it on.</li>
  <li><b>Clues:</b> the app picks who starts. Going around, each player says <b>one word</b> related to the card. Clear enough to show you know it, vague enough not to give it away.</li>
  <li><b>Discussion:</b> start the countdown and argue about who's faking it.</li>
  <li><b>Vote:</b> agree on one player and vote them out.<br>· If they were an impostor, they get one last chance: if they guess the card, they steal the round.<br>· If they were innocent, the impostors win.</li>
  <li><b>Reveal:</b> the app shows the card, who the impostors were and the scores.</li></ol>
  <h3>Who wins</h3><ul>
  <li><b>The innocents</b>, if they catch the impostor and the impostor doesn't guess the card.</li>
  <li><b>The impostor</b>, if they survive the vote or guess the card.</li></ul>
  <p>“Play again” starts a new round with a new card and new impostors, with no repeats. Tonight's score keeps count of how many rounds each side has won.</p>`
}};
function helpBtn(g,cls){return `<button class="${cls||"link"}" data-a="help" data-g="${g}">${(HELP[S.lang]||HELP.es).title}</button>`}
function helpHTML(){
  if(!S.help)return"";const h=HELP[S.lang]||HELP.es,g=S.help;
  const tabs=`<div class="seg wide help-tabs" role="tablist">${[["encore","Encore"],["fakeid","Fake ID"],["drop","Drop"],["spot","Spotlight"]].map(([k,n])=>`<button data-a="help" data-g="${k}" class="${g===k?"on":""}" role="tab" aria-selected="${g===k}">${n}</button>`).join("")}</div>`;
  return `<div class="veil help" data-a="helpVeil"><div class="sheet howto" role="dialog" aria-modal="true" aria-label="${h.title}">
    <div class="toprow"><h2>${h.title}</h2>${tabs}</div>
    ${h[g]}${h.general}
    <button class="btn btn-main center" data-a="helpClose">${h.close}</button></div></div>`;
}

  const crew=o==="crew",names=crew?fi.players.filter((p,i)=>!fi.imp.includes(i)):fi.imp.map(i=>fi.players[i]);
  const eyebrow=crew?f.crewWin:o==="steal"?f.impSteal:f.impWin(fi.imp.length);
  const title=crew&&names.length>4?esc(f.crewW):names.map(esc).join("<br>");
  discoFx(eyebrow,title,!(crew&&names.length>4)&&names.join(" & ").length>16,crew?"#25c46f":null,null,esc(f.nightScore(t.crew,t.imp)),P().tapCont);
}

function showShuffle(sub){
  const cs=[["-160%","-120%","-40deg","-8deg",0],["160%","-90%","35deg","6deg",.12],["-150%","130%","25deg","-3deg",.24],["150%","120%","-30deg","4deg",.36],["0","-180%","10deg","-1deg",.48]];
  fx.innerHTML=`<div class="deck">${cs.map(c=>`<div class="fc" style="--x:${c[0]};--y:${c[1]};--r:${c[2]};--rr:${c[3]};animation-delay:${c[4]}s"></div>`).join("")}<div class="fc top" style="--x:0;--y:200%;--r:0deg;--rr:0deg"><div class="msg">${T().gameStarts}</div><div class="sub">${sub||T().cardsN(S.deck.length)}</div></div></div>`;
  fx.hidden=false;fx.onclick=closeFx;fxTimer=setTimeout(closeFx,3200);
}

/* ---------- Eventos ---------- */
app.addEventListener("input",e=>{
  if(e.target.dataset.team!==undefined){S.teams[+e.target.dataset.team].name=e.target.value;save()}
  if(e.target.id==="custom"){S.custom=e.target.value;save()}
  if(e.target.dataset.player!==undefined){S.fi.players[+e.target.dataset.player]=e.target.value;save()}
  if(e.target.dataset.plist){plList(e.target.dataset.plist)[+e.target.dataset.pi]=e.target.value;save()}
  if(e.target.id==="numCards"){S.numCards=clampCards(+e.target.value);const o=document.getElementById("numOut");if(o)o.textContent=S.numCards;save()}
});
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;audio();
  const a=b.dataset.a,i=+b.dataset.i;
  switch(a){
    case"lang":setLang(b.dataset.l);break;
    case"theme":S.theme=b.dataset.m;break;
    case"addTeam":S.teams.push({name:T().teamN(S.teams.length+1),color:COLORS.find(c=>!S.teams.some(t=>t.color===c))||COLORS[0]});break;
    case"delTeam":S.teams.splice(i,1);break;
    case"cards":S.numCards=clampCards(S.numCards+ +b.dataset.d);break;
    case"secs":S.turnSecs=Math.min(120,Math.max(15,S.turnSecs+ +b.dataset.d));break;
    case"toReview":S.numCards=clampCards(S.numCards);S.teams.forEach((t,k)=>{if(!t.name.trim())t.name=T().teamN(k+1)});buildDeck();S.screen="review";break;
    case"mode":{const m=b.dataset.m,on=S.modes.includes(m);if(on&&S.modes.length===1)break;S.modes=on?S.modes.filter(x=>x!==m):[...S.modes,m];S.numCards=clampCards(S.numCards);}break;
    case"hub":S.app="hub";break;
    case"goEncore":S.app="encore";break;
    case"goFake":S.app="fakeid";if(S.fi.screen==="setup")S.fi.players=seedPlayers(S.fi.players);save();render();showFoco();return;
    case"goDrop":S.app="drop";if(S.dr.screen==="setup")S.dr.players=seedPlayers(S.dr.players);save();render();showDropIntro();return;
    case"goSpot":S.app="spot";if(S.sp.screen==="setup")S.sp.players=seedPlayers(S.sp.players);save();render();showSpotIntro();return;
    case"plAdd":{const l=plList(b.dataset.k);l.push(F().playerN(l.length+1));}break;
    case"plDel":plList(b.dataset.k).splice(i,1);if(b.dataset.k==="fi")S.fi.impostors=Math.min(S.fi.impostors,maxImps());break;
    case"drLives":S.dr.lives=Math.max(1,Math.min(5,S.dr.lives+ +b.dataset.d));break;
    case"drFuse":S.dr.fuse=b.dataset.v;break;
    case"drMode":{const m=b.dataset.m,dr=S.dr,on=dr.modes.includes(m);if(on&&dr.modes.length===1)break;dr.modes=on?dr.modes.filter(x=>x!==m):[...dr.modes,m];}break;
    case"drStart":drStart();save();render();showShuffle(S.dr.players.length+" "+F().players.toLowerCase());return;
    case"drOther":drPick();break;
    case"drGo":audio();drGo();return;
    case"drPass":drPass();return;
    case"drAfter":drAfter();return;
    case"drAgain":drStart();save();render();showShuffle(S.dr.players.length+" "+F().players.toLowerCase());return;
    case"drSettings":S.dr.screen="setup";break;
    case"spDeck":{const v=b.dataset.v,sp=S.sp,on=sp.decks.includes(v);if(on&&sp.decks.length===1)break;sp.decks=on?sp.decks.filter(x=>x!==v):[...sp.decks,v];}break;
    case"spRounds":S.sp.rounds=Math.max(5,Math.min(50,S.sp.rounds+ +b.dataset.d));break;
    case"spStart":spStart();save();render();showShuffle(S.sp.players.length+" "+F().players.toLowerCase());return;
    case"spPoint":audio();showCountdown(()=>{S.sp.screen="pick";save();render()});return;
    case"spSel":{const sp=S.sp;sp.sel=sp.sel.includes(i)?sp.sel.filter(x=>x!==i):[...sp.sel,i];}break;
    case"spReveal":{const sp=S.sp;if(!sp.sel.length)return;sp.picked=sp.sel.slice().sort((a,b)=>a-b);sp.picked.forEach(k=>sp.tally[sp.players[k]]=(sp.tally[sp.players[k]]||0)+1);sp.screen="result";save();render();showSpotReveal();return}
    case"spNext":spNext();break;
    case"spEnd":S.sp.screen="final";save();render();celebrateSpot();return;
    case"spAgain":spStart();save();render();showShuffle(S.sp.players.length+" "+F().players.toLowerCase());return;
    case"spSettings":S.sp.screen="setup";break;
    case"gDoEnd":S.menu=null;S.menuPaused=false;if(S.app==="spot"){S.sp.screen="final";save();render();celebrateSpot();return}break;
    case"gDoSet":S.menu=null;S.menuPaused=false;if(S.app==="drop"){drPause();S.dr.screen="setup"}else if(S.app==="spot")S.sp.screen="setup";break;
    case"mSwitch":S.menu=null;S.menuPaused=false;S.app="hub";break;
    case"fiAddP":S.fi.players.push(F().playerN(S.fi.players.length+1));break;
    case"fiDelP":S.fi.players.splice(i,1);S.fi.impostors=Math.min(S.fi.impostors,maxImps());break;
    case"fiImp":S.fi.impostors=Math.max(1,Math.min(maxImps(),S.fi.impostors+ +b.dataset.d));break;
    case"fiDeb":S.fi.debateSecs=Math.max(60,Math.min(600,S.fi.debateSecs+ +b.dataset.d));break;
    case"fiHint":S.fi.hint=b.dataset.v;break;
    case"fiMode":{const m=b.dataset.m,on=S.fi.modes.includes(m);if(on&&S.fi.modes.length===1)break;S.fi.modes=on?S.fi.modes.filter(x=>x!==m):[...S.fi.modes,m];}break;
    case"fiDeal":fiStartGame();save();render();showShuffle(S.fi.players.length+" "+F().players.toLowerCase());return;
    case"fiNext":if(!S.fi.revealed)return;if(S.fi.turn<S.fi.players.length-1){S.fi.turn++;S.fi.revealed=false}else{S.fi.screen="debate"}break;
    case"fiClock":if(S.fi.running)fiStop();else fiRun();break;
    case"fiToVote":fiStop();S.fi.screen="vote";break;
    case"fiSel":S.fi.sel=i;break;
    case"fiExpel":if(S.fi.sel==null)return;S.fi.accused=S.fi.sel;S.fi.screen="result";save();render();showGuestlist();return;
    case"fiGuess":fiOutcome(b.dataset.v==="1"?"steal":"crew");save();render();celebrateFI();return;
    case"fiSeeRes":fiOutcome("escape");save();render();celebrateFI();return;
    case"fiNewRound":fiNewRound();save();render();showShuffle(S.fi.players.length+" "+F().players.toLowerCase());return;
    
    case"fiSettings":S.fi.screen="setup";break;
    case"fiAgain":fiAgainGo();return;
    
    case"fiDoSet":fiStop();S.menu=null;S.menuPaused=false;S.fi.scores={};S.fi.round=0;S.fi.screen="setup";break;
    case"menu":openMenu("main");return;
    case"help":S.help=b.dataset.g;render();return;
    case"helpClose":S.help=null;render();return;
    case"helpVeil":if(e.target===b){S.help=null;render()}return;
    case"veil":if(e.target===b){closeMenu()}return;
    case"resume":closeMenu();return;
    case"mScores":S.menu="scores";render();return;
    case"mEnd":S.menu="confirmEnd";render();return;
    case"mTheme":S.menu="confirmTheme";render();return;
    case"doEnd":stopTimer();if(S.current){S.remaining.push(S.current);S.current=null}S.menu=null;S.paused=false;S.screen="gameEnd";save();render();celebrateEncore();return;
    case"doTheme":stopTimer();S.current=null;S.menu=null;S.paused=false;S.scores=[];S.round=1;S.screen="setup";break;
    case"back":S.screen="setup";break;
    case"swap":{const c=S.deck[i],j=S.spare.findIndex(x=>x[1]===c[1]);if(j>=0){const n=S.spare.splice(j,1)[0];S.spare.push(c);S.deck[i]=n}}break;
    case"start":startGame();save();render();showShuffle();return;
    case"toReady":S.screen="turnReady";break;
    case"reveal":reveal();return;
    case"hit":hit();return;
    case"pass":pass();return;
    case"pause":togglePause();return;
    case"toggle":toggleGuess(i);return;
    case"next":nextTurn();return;
    case"nextRound":nextRound();return;
    case"rematch":buildDeck();S.screen="review";break;
    case"again":encoreAgain();return;
    case"newSetup":S.screen="setup";break;
  }
  save();render();
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)return;
  if(S.app==="drop"&&S.dr.running){drPause();save();render()}
  else if(S.app==="fakeid"&&S.fi.running){fiStop();save();render()}
  else if(S.app==="encore"&&S.screen==="playing"&&!S.paused){stopTimer();S.paused=true;save();render()}});
function holdShow(h){h.classList.add("show")}
function holdHide(){const h=app.querySelector("[data-hold].show");if(!h)return;h.classList.remove("show");
  if(S.app==="fakeid"&&!S.fi.revealed){S.fi.revealed=true;save();const nb=app.querySelector('[data-a="fiNext"]');if(nb)nb.disabled=false}}
app.addEventListener("pointerdown",e=>{const h=e.target.closest("[data-hold]");if(h){e.preventDefault();holdShow(h)}});
document.addEventListener("pointerup",holdHide);document.addEventListener("pointercancel",holdHide);
app.addEventListener("contextmenu",e=>{if(e.target.closest("[data-hold]"))e.preventDefault()});
app.addEventListener("keydown",e=>{const h=e.target.closest&&e.target.closest("[data-hold]");if(h&&(e.key===" "||e.key==="Enter")){e.preventDefault();holdShow(h)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.help){S.help=null;render()}});
app.addEventListener("keyup",e=>{if(e.key===" "||e.key==="Enter")holdHide()});

/* ---------- Arranque ---------- */
function validCard(c){return Array.isArray(c)&&(c[1]==="custom"||THEMES[c[1]])}
function start(data){
  const fresh0=!(data&&data.screen);
  S=(data&&data.screen)?data:(load()||fresh());
  if(!S.lang)S.lang="es";if(!S.theme)S.theme="dark";
  const okModes=Array.isArray(S.modes)&&S.modes.length&&S.modes.every(m=>THEMES[m]);
  const okDeck=(S.deck||[]).every(validCard);
  if(!okModes||!okDeck){const keep={teams:S.teams,lang:S.lang,theme:S.theme,custom:S.custom||"",fi:S.fi};S=Object.assign(fresh(),keep);}
  if(S.screen==="playing"){S.paused=true}
  if(!S.fi)S.fi=fiFresh(S.lang);
  if(!S.dr||!S.dr.players)S.dr=drFresh(S.lang);if(!S.sp||!S.sp.players)S.sp=spFresh(S.lang);
  S.dr.running=false;if(S.dr.screen==="live"){S.dr.screen="ready"}
  if(S.dr.prompt&&!(HINTS[S.dr.prompt.k]))S.dr=drFresh(S.lang);
  if(!S.fi.modes.every(m=>THEMES[m]))S.fi.modes=ALL_MODES.slice();
  if(S.fi.hint===true)S.fi.hint="detail";if(S.fi.hint===false)S.fi.hint="none";if(!["none","cat","detail"].includes(S.fi.hint))S.fi.hint="detail";
  if(!S.fi.tally)S.fi.tally={crew:0,imp:0};if(S.fi.screen==="final")S.fi.screen="setup";
  S.fi.running=false;
  if(!S.app||fresh0)S.app="hub";
  S.menu=null;S.menuPaused=false;S.help=null;
  render();
  if(fresh0)showIntro();
}
window.claude?.hot?.snapshot?.(()=>{const c={...S,fi:{...S.fi,running:false},dr:{...S.dr,running:false}};if(c.screen==="playing")c.paused=true;return c});
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
